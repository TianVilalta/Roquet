<body>
<div id="overlay">
  <h2>Sales VR — Quest 3</h2>
  <div id="status">Carregant...</div>
</div>
<div id="controllerInfo">Mandos: esperant sessió VR...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }

</script>
<script>
  window.addEventListener('error', e => {
    const s = document.getElementById('status');
    if (s) { s.textContent = 'Error: ' + (e.message || e); s.style.color = '#f66'; }
  });
  window.addEventListener('unhandledrejection', e => {
    const s = document.getElementById('status');
    if (s) { s.textContent = 'Error: ' + (e.reason?.message ?? e.reason); s.style.color = '#f66'; }
  });
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ─── ESTATS DE NAVEGACIÓ ──────────────────────────────────────────────
let state = 'mainHub';  
const buttonStates = {};
let roomWindow = null;  
const roomLabels = [];

const _fwd = new THREE.Vector3();
const _cam = new THREE.Vector3();
const _to  = new THREE.Vector3();
const _camPos2D = new THREE.Vector3();

// ─── RENDERITZADOR I LLUMS ────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 300);
scene.add(camera);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

let headsetVisibilityHandlerAttached = false;
let lastXRFrameTime = null;
let pendingHubRecenter = false;
const HEADSET_OFF_FRAME_GAP_MS = 1000;

renderer.xr.addEventListener('sessionstart', () => {
  resetToMainHub();
  attachHeadsetVisibilityHandler();
});
renderer.xr.addEventListener('sessionend', () => {
  resetToMainHub();
  detachHeadsetVisibilityHandler();
});
document.body.appendChild(renderer.domElement);

function resetToMainHub() {
  exitToMainHub();
  recenterMainHubAroundUser();
  pendingHubRecenter = true;
}

function markHeadsetOffOrPaused() {
  resetToMainHub();
  lastXRFrameTime = null;
}

function onHeadsetVisibilityChange(event) {
  const state = event?.session?.visibilityState || renderer.xr.getSession()?.visibilityState;
  if (state === 'hidden' || state === 'visible' || state === 'visible-blurred') {
    markHeadsetOffOrPaused();
  }
}

function onDocumentVisibilityChange() {
  if (document.visibilityState === 'visible' || document.visibilityState === 'hidden') {
    markHeadsetOffOrPaused();
  }
}

function attachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (!session || headsetVisibilityHandlerAttached) return;
  session.addEventListener('visibilitychange', onHeadsetVisibilityChange);
  document.addEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = true;
}

function detachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (session) {
    session.removeEventListener('visibilitychange', onHeadsetVisibilityChange);
  }
  document.removeEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = false;
  lastXRFrameTime = null;
}

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemiLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight1.position.set(5, 12, 6);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight2.position.set(-5, 8, -6);
scene.add(dirLight2);

const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

// ─── DADES DE LES SECCIONS PRINCIPALS ────────────────────────────────
const mainSections = [
  { id: 'origens', label: 'Els orígens', isGroup: false },
  { id: 'creixement', label: 'El creixement', isGroup: false },
  { id: 'grup', label: "El Grup ROQUET", isGroup: true },
  { id: 'impacte', label: "L'impacte", isGroup: false },
  { id: 'futur', label: 'El futur', isGroup: false }
];

// ─── DADES DE LES UBICACIONS DE "EL GRUP ROQUET" ──────────────────────
const groupThemes = [
  { label: 'Ubicació 1', color: 0xe63946, img: 'pedro.png', id: 'pedro',
    text: 'Ubicada en Tona, a 50km al norte de Barcelona, ofrece las funciones corporativas para todo el grupo',
    text2: '08551 Tona , Barcelona , España' },
  { label: 'Ubicació 2', color: 0x2dc653, img: 'hydraulics.png', id: 'hydraulics',
    text: 'Ubicada en Tona, a 50km al norte de Barcelona, aqui es donde se fabrican los distribuidores hidraulicos.',
    text2: '08551 Tona , Barcelona, España' },
  { label: 'Ubicació 3', color: 0x4895ef, img: 'fundiciones.png', id: 'fundiciones',
    text: 'Ubicada en Vic a 60 km al norte de Barcelona. Especializada en la producción de bombas y motores hidráulicos, tanto de aluminio como de fundición',
    text2: '08510, Roda de Ter, Barcelona, España' },
  { label: 'Ubicació 4', color: 0xf4a261, img: 'dinacil.png', id: 'dinacil',
    text: 'Ubicada en Centelles a 40 km al norte de Barcelona. Producción automatizada de cilindros hidráulicos pequeños.',
    text2: '08540 , Centelles, Barcelona, España' },
  { label: 'Ubicació 5', color: 0xff8844, img: 'eastern.png', id: 'eastern',
    text: 'Inaugurada en 2015 en Ploiesti (Rumanía) a 60km de Bucarest. Fabricación de cilindros hidráulicos medianos i grandes.',
    text2: '107025 Aricestii Rahtivani , Prahova , Romania' },
  { label: 'Ubicació 6', color: 0x8a6cff, img: 'tekor.png', id: 'tekor',
    text: 'Ubicada en Roda de Ter, a 65 km al norte de Barcelona. Fundición especializada en piezas de fundición gris y nodular / SG / fundición dúctil.',
    text2: '08500 , Vic, Barcelona, España' },
];

// ─── CARGA DE FONS 3D (ROOM.GLB) ──────────────────────────────────────
const ROOM_TARGET_HEIGHT = 12.0; 
const backgroundGroup = new THREE.Group();
scene.add(backgroundGroup);

function getThemeBackgroundAsset(theme) {
  if (!theme?.img) return 'room.glb';
  return theme.img.replace(/\.[^.]+$/, '.glb');
}

function loadRoomBackground(assetPath = 'room.glb') {
  const glLoader = new GLTFLoader();
  glLoader.load(
    assetPath,
    (gltf) => {
      const model = gltf.scene;
      clearGroup(backgroundGroup);

      model.traverse((obj) => {
        if (obj.isMesh && obj.material) {
          if (obj.material.map) obj.material.map.colorSpace = THREE.SRGBColorSpace;
          obj.material.roughness = 0.8;
          obj.material.metalness = 0.1;
        }
      });

      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      const height = size.y || 1;
      const scale = ROOM_TARGET_HEIGHT / height;
      model.scale.setScalar(scale);

      box.setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;
      model.position.y -= 4.5; 
      model.rotation.y = Math.PI;

      backgroundGroup.add(model);
      
      const s = document.getElementById('status');
      if (s) s.textContent = 'Fons 3D carregat correctament.';
    },
    undefined,
    (error) => console.error(`No s'ha pogut carregar ${assetPath}`, error)
  );
}

loadRoomBackground('room.glb');

// ─── HELPER NETEJA GRUPS ──────────────────────────────────────────────
function clearGroup(g, preserveKey = '') {
  while (g.children.length) {
    const c = g.children[0];
    g.remove(c);
    if (preserveKey && c.userData?.[preserveKey]) continue;
    c.geometry?.dispose();
    if (c.material) {
      (Array.isArray(c.material) ? c.material : [c.material]).forEach(m => m.dispose());
    }
  }
}

// ─── 1. SALA PRINCIPAL (MAIN HUB: 5 SECCIONS) ──────────────────────────
const mainHubGroup = new THREE.Group();
scene.add(mainHubGroup);

function recenterMainHubAroundUser() {
  camera.getWorldPosition(_cam);
  mainHubGroup.position.set(_cam.x, 0, _cam.z);
}

const mainPanels = [];
const MAIN_RADIUS = 2.8;
const MAIN_Y = 1.1;

function createMainHubPanels() {
  clearGroup(mainHubGroup);
  mainPanels.length = 0;

  for (let i = 0; i < mainSections.length; i++) {
    const angle = (i / mainSections.length) * Math.PI * 2;
    const x = Math.sin(angle) * MAIN_RADIUS;
    const z = -Math.cos(angle) * MAIN_RADIUS;

    const canvas = document.createElement('canvas');
    canvas.width = 1024; canvas.height = 360;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#0f1115';
    ctx.beginPath();
    ctx.roundRect(16, 16, 1024 - 32, 360 - 32, 40);
    ctx.fill();

    ctx.strokeStyle = '#666666';
    ctx.lineWidth = 12;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 58px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(mainSections[i].label, 1024 / 2, 360 / 2);

    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.56), mat);

    mesh.position.set(x, MAIN_Y, z);
    mesh.lookAt(0, MAIN_Y, 0);

    mainHubGroup.add(mesh);
    mainPanels.push({ mesh, section: mainSections[i], index: i, prog: 0 });
  }
}

createMainHubPanels();

// ─── 2. SUB-HUB: EL GRUP ROQUET (6 IMATGES PNG AMB TRANSPARÈNCIA) ──────
const groupHubGroup = new THREE.Group();
groupHubGroup.visible = false;
scene.add(groupHubGroup);

const groupCubes = [];
const groupLabelPlanes = [];
const IMAGE_WIDTH = 1.2;
const IMAGE_Y = 1.0;
const HOVER_SCALE = 1.18;

function buildGroupHub() {
  clearGroup(groupHubGroup);
  groupCubes.length = 0;
  groupLabelPlanes.length = 0;

  camera.getWorldPosition(_cam);
  groupHubGroup.position.set(_cam.x, 0, _cam.z);

  const loader = new THREE.TextureLoader();

  for (let i = 0; i < groupThemes.length; i++) {
    const angle = (i / groupThemes.length) * Math.PI * 2;
    const x = Math.sin(angle) * MAIN_RADIUS;
    const z = -Math.cos(angle) * MAIN_RADIUS;
    const theme = groupThemes[i];

    const bcanvas = document.createElement('canvas');
    bcanvas.width = 1024; bcanvas.height = 160;
    const bc = bcanvas.getContext('2d');
    bc.clearRect(0,0,bcanvas.width,bcanvas.height);
    bc.fillStyle = '#ffffff';
    bc.font = 'bold 40px Arial';
    bc.textAlign = 'center';
    
    function drawWrappedTextCentered(ctx, text, centerX, maxWidth, lineHeight) {
      ctx.textBaseline = 'middle';
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          lines.push(line.trim());
          line = words[n] + ' ';
        } else line = testLine;
      }
      if (line) lines.push(line.trim());
      const totalH = lines.length * lineHeight;
      const canvasH = ctx.canvas ? ctx.canvas.height : 0;
      let startY = canvasH / 2 - totalH / 2 + lineHeight / 2;
      for (let j = 0; j < lines.length; j++) ctx.fillText(lines[j], centerX, startY + j * lineHeight);
    }

    drawWrappedTextCentered(bc, theme.text2, bcanvas.width/2, bcanvas.width - 160, 40);
    const btex = new THREE.CanvasTexture(bcanvas);
    const bmat = new THREE.MeshBasicMaterial({ map: btex, transparent: true, side: THREE.DoubleSide });
    const bmesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.28), bmat);
    bmesh.position.set(x, IMAGE_Y - 0.4 - 0.12, z);
    bmesh.lookAt(0, IMAGE_Y - 0.4 - 0.12, 0);
    groupHubGroup.add(bmesh);

    // MATERIAL CONFIGURAT PER SUPORTAR PNG TRANSPARENTS SENSE FONS NEGRE
    const pngMaterial = new THREE.MeshStandardMaterial({ 
      side: THREE.DoubleSide, 
      transparent: true, 
      alphaTest: 0.1,
      roughness: 0.5,
      metalness: 0.1
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), pngMaterial);
    mesh.position.set(x, IMAGE_Y, z);
    mesh.lookAt(0, IMAGE_Y, 0);
    groupHubGroup.add(mesh);
    
    loader.load(theme.img, (texLoaded) => {
      texLoaded.colorSpace = THREE.SRGBColorSpace;
      mesh.material.map = texLoaded;
      mesh.material.needsUpdate = true;
      const iw = texLoaded.image?.naturalWidth || texLoaded.image?.width || 1024;
      const ih = texLoaded.image?.naturalHeight || texLoaded.image?.height || 1024;
      const w = IMAGE_WIDTH * 0.5; 
      const h = w * (ih / iw);
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(w, h);
      mesh.position.set(x, IMAGE_Y, z);
      mesh.lookAt(0, IMAGE_Y, 0);
      
      const labelHeight = 0.36;
      bmesh.geometry.dispose();
      bmesh.geometry = new THREE.PlaneGeometry(Math.max(w * 1.6, 0.6), labelHeight);
      const imgBottomY = IMAGE_Y - h / 2;
      const gap = 0.08;
      const bY = imgBottomY - gap - labelHeight / 2;
      const imgPos = mesh.position.clone();
      bmesh.position.set(imgPos.x, bY, imgPos.z);
      bmesh.lookAt(0, bY, 0);
    });

    groupCubes.push({ mesh, index: i, prog: 0 });
    groupLabelPlanes.push(bmesh);
  }
}

// ─── 3. SALA INTERIOR DE TEMES / UBICACIONS / BUIDA ────────────────────
const roomGroup = new THREE.Group();
roomGroup.visible = false;
scene.add(roomGroup);

let currentActiveThemeIndex = 0;

function makeRoomTextPanelCanvas(theme) {
  const S = 512;
  const canvas = document.createElement('canvas');
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(255, 255, 255, 0.96)';
  ctx.beginPath();
  ctx.roundRect(10, 10, S - 20, S - 20, 20);
  ctx.fill();

  const themeColor = '#' + new THREE.Color(theme.color).getHexString();
  ctx.strokeStyle = themeColor;
  ctx.lineWidth = 8;
  ctx.stroke();

  ctx.fillStyle = '#111111';
  ctx.font = 'bold 28px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(theme.label.toUpperCase(), S/2, 40);

  ctx.fillStyle = '#222222';
  ctx.font = '22px Arial';
  function wrapText(context, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (context.measureText(testLine).width > maxWidth && n > 0) {
        context.fillText(line, x, y);
        line = words[n] + ' ';
        y += lineHeight;
      } else { line = testLine; }
    }
    context.fillText(line, x, y);
  }
  wrapText(ctx, theme.text, S/2, 100, S - 60, 32);

  return canvas;
}

function buildEmptyRoom() {
  clearGroup(roomGroup);
  loadRoomBackground('room.glb');
  state = 'emptyRoom';
  mainHubGroup.visible = false;
  groupHubGroup.visible = false;
  roomGroup.visible = true;
}

function buildThemeRoom(themeIndex) {
  clearGroup(roomGroup);
  currentActiveThemeIndex = themeIndex;
  
  const theme = groupThemes[themeIndex];
  if (theme) {
    loadRoomBackground(getThemeBackgroundAsset(theme));
  }

  roomLabels.length = 0; 
  const labels = ['Historia', 'Productes', 'Grup'];
  const RL_RADIUS = 2.4;
  const RL_Y = 1.2;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  if (dir.lengthSq() === 0) dir.set(0, 0, -1);
  dir.normalize();
  const baseAngle = Math.atan2(dir.x, -dir.z);
  const labelAngles = [baseAngle, baseAngle + (2 * Math.PI / 3), baseAngle - (2 * Math.PI / 3)];
  
  for (let i = 0; i < labels.length; i++) {
    const ang = labelAngles[i];
    const lx = Math.sin(ang) * RL_RADIUS;
    const lz = -Math.cos(ang) * RL_RADIUS;

    const lc = document.createElement('canvas'); lc.width = 512; lc.height = 120;
    const lctx = lc.getContext('2d');
    lctx.clearRect(0,0,lc.width,lc.height);
    lctx.beginPath(); lctx.moveTo(6+18,6); lctx.arcTo(512-6,6,512-6,120-6,18); lctx.arcTo(512-6,120-6,6,120-6,18); lctx.arcTo(6,120-6,6,6,18); lctx.arcTo(6,6,512-6,6,18); lctx.closePath();
    lctx.fillStyle = 'rgba(255,255,255,0.98)'; lctx.fill();
    lctx.fillStyle = '#111111'; lctx.font = 'bold 56px Arial'; lctx.textAlign = 'center';
    lctx.fillText(labels[i], lc.width/2, lc.height/2 + 8);

    const ltex = new THREE.CanvasTexture(lc);
    const lmesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.35), new THREE.MeshBasicMaterial({ map: ltex, transparent: true, side: THREE.DoubleSide }));
    lmesh.position.set(lx, RL_Y, lz);
    lmesh.lookAt(0, RL_Y, 0);
    lmesh.material.opacity = 0.5;
    roomGroup.add(lmesh);
    roomLabels.push({ mesh: lmesh, index: i, prog: 0, text: labels[i] });
  }

  mainHubGroup.visible = false;
  groupHubGroup.visible = false;
  roomGroup.visible = true;
  state = 'themeRoom';
}

function openLabelWindow(ridx) {
  if (roomWindow) { 
    roomGroup.remove(roomWindow); 
    roomWindow.geometry?.dispose(); 
    (Array.isArray(roomWindow.material)?roomWindow.material:[roomWindow.material]).forEach(m=>m.dispose()); 
    roomWindow = null; 
  }
  
  const info = roomLabels[ridx];
  if (!info) return;
  const p = info.mesh.position.clone();
  const theme = groupThemes[currentActiveThemeIndex];

  let mesh;

  if (theme && theme.id === 'hydraulics') {
    const cw = 1024, ch = 512;
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,cw,ch);
    ctx.beginPath(); ctx.moveTo(12+24,12); ctx.arcTo(cw-12,12,cw-12,ch-12,24); ctx.arcTo(cw-12,ch-12,12,ch-12,24); ctx.arcTo(12,ch-12,12,12,24); ctx.arcTo(12,12,cw-12,12,24); ctx.closePath();
    ctx.fillStyle='rgba(255,255,255,0.98)'; ctx.fill();
    ctx.fillStyle = '#111111'; ctx.font = 'bold 64px Arial'; ctx.textAlign='center'; 
    ctx.fillText(info.text, cw/2, ch/2);
    
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), mat);
  } else {
    const textCanvas = makeRoomTextPanelCanvas(theme);
    const tex = new THREE.CanvasTexture(textCanvas);
    const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true });
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), mat);
  }
  
  camera.getWorldPosition(_cam); 
  const dir = _cam.clone().sub(p).normalize(); 
  const frontPos = p.clone().add(dir.multiplyScalar(0.4));
  
  mesh.position.copy(frontPos); 
  mesh.lookAt(_cam.x, frontPos.y, _cam.z); 
  
  roomGroup.add(mesh); 
  roomWindow = mesh;
}

// ─── LÒGICA DE DEVOLUCIÓ/SORTIDA (BOTÓ B) ──────────────────────────────
function exitToMainHub() {
  clearGroup(roomGroup);
  clearGroup(groupHubGroup);
  roomGroup.visible = false;
  groupHubGroup.visible = false;
  mainHubGroup.visible = true;
  loadRoomBackground('room.glb');
  state = 'mainHub';
}

function exitToGroupHub() {
  clearGroup(roomGroup);
  roomGroup.visible = false;
  groupHubGroup.visible = true;
  loadRoomBackground('room.glb');
  state = 'groupHub';
}

// ─── RAYCASTING I DETECCIÓ DE MIRADA ─────────────────────────────────
function getLookedMainPanel() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.72;
  for (let i = 0; i < mainPanels.length; i++) {
    _to.copy(mainPanels[i].mesh.position).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

function getLookedGroupCube() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.72;
  for (let i = 0; i < groupCubes.length; i++) {
    _to.copy(groupCubes[i].mesh.position).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

function getLookedRoomLabel() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.7;
  for (let i = 0; i < roomLabels.length; i++) {
    _to.copy(roomLabels[i].mesh.position).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

// ─── BOTÓ WEBXR SUPORT ──────────────────────────────────────────────────
const statusEl = document.getElementById('status');
statusEl.textContent = 'Three.js carregat. Comprovant suport VR...';

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(supported => {
    if (supported) {
      statusEl.textContent = 'Llest. Posa\'t les ulleres i prem el botó virtual.';
      document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['local-floor', 'bounded-floor'] }));
    } else {
      statusEl.textContent = 'VR no suportat. Obre aquest enllaç per HTTPS dins el Meta Quest Browser.';
    }
  }).catch(err => {
    statusEl.textContent = 'Error WebXR: ' + err.message;
  });
} else {
  statusEl.textContent = 'WebXR absent. Si us plau, utilitza les ulleres Quest 3.';
}

// ─── CONTROLADORS INPUTS MANDOS VR ────────────────────────────────────
const infoEl = document.getElementById('controllerInfo');

function handleInput(frame) {
  const session = renderer.xr.getSession(); if (!session) return;
  const refSpace = renderer.xr.getReferenceSpace(); let infoText = 'Posició dels mandos:\n'; let anyController = false;

  for (const src of session.inputSources) {
    if (!src.gamepad) continue;
    if (frame && refSpace) {
      const space = src.gripSpace || src.targetRaySpace;
      if (space) {
        const pose = frame.getPose(space, refSpace);
        if (pose) { anyController = true; const p = pose.transform.position; const hand = src.handedness === 'right' ? 'Dret    ' : 'Esquerre'; infoText += `${hand}: x=${p.x.toFixed(2)}  y=${p.y.toFixed(2)}  z=${p.z.toFixed(2)}\n`; }
      }
    }
    if (src.handedness !== 'right') continue;
    const gp = src.gamepad; 
    const aPressed = gp.buttons[4]?.pressed; 
    const bPressed = gp.buttons[5]?.pressed;

    // BOTÓ A (Selecció)
    if (aPressed && !buttonStates.a) {
      if (state === 'mainHub') {
        const idx = getLookedMainPanel();
        if (idx !== -1) {
          const sec = mainSections[idx];
          if (sec.isGroup) {
            buildGroupHub();
            mainHubGroup.visible = false;
            groupHubGroup.visible = true;
            state = 'groupHub';
          } else {
            buildEmptyRoom();
          }
        }
      } else if (state === 'groupHub') {
        const idx = getLookedGroupCube();
        if (idx !== -1) {
          buildThemeRoom(idx);
        }
      } else if (state === 'themeRoom') {
        const ridx = getLookedRoomLabel();
        if (ridx !== -1) openLabelWindow(ridx);
      }
    }

    // BOTÓ B (Tornar enrere)
    if (bPressed && !buttonStates.b) {
      if (state === 'groupHub' || state === 'emptyRoom') {
        exitToMainHub();
      } else if (state === 'themeRoom') {
        if (roomWindow) {
          roomGroup.remove(roomWindow); roomWindow.geometry?.dispose(); 
          (Array.isArray(roomWindow.material)?roomWindow.material:[roomWindow.material]).forEach(m=>m.dispose()); 
          roomWindow = null;
        } else {
          exitToGroupHub();
        }
      }
    }
    buttonStates.a = aPressed; buttonStates.b = bPressed;
  }
  if(infoEl) infoEl.textContent = anyController ? infoText : 'Mandos: cap detectat';
}

// ─── BUCLE D'ANIMACIÓ I RENDER ──────────────────────────────────────────
function detectHeadsetResumeFromFrameGap(time, frame) {
  if (!renderer.xr.getSession() || !frame) { lastXRFrameTime = null; return; }
  if (lastXRFrameTime !== null && time - lastXRFrameTime > HEADSET_OFF_FRAME_GAP_MS) { resetToMainHub(); }
  lastXRFrameTime = time;
}

function animate(time, frame) {
  detectHeadsetResumeFromFrameGap(time, frame);
  if (pendingHubRecenter && renderer.xr.getSession() && frame) { 
    recenterMainHubAroundUser(); 
    pendingHubRecenter = false; 
  }

  camera.getWorldPosition(_camPos2D);

  if (state === 'mainHub') {
    const looked = getLookedMainPanel();
    for (let i = 0; i < mainPanels.length; i++) {
      const p = mainPanels[i];
      const target = (i === looked) ? 1 : 0;
      p.prog += (target - p.prog) * 0.12;
      p.mesh.scale.setScalar(1 + 0.18 * p.prog);
      p.mesh.lookAt(_camPos2D.x, p.mesh.position.y, _camPos2D.z);
    }
  } else if (state === 'groupHub') {
    const looked = getLookedGroupCube();
    for (let i = 0; i < groupCubes.length; i++) {
      const c = groupCubes[i]; 
      const target = (i === looked) ? 1 : 0; 
      c.prog += (target - c.prog) * 0.12;
      c.mesh.scale.setScalar(1 + (HOVER_SCALE - 1) * c.prog);
      const camPos3 = new THREE.Vector3(); 
      camera.getWorldPosition(camPos3); 
      c.mesh.lookAt(camPos3.x, camPos3.y - 0.25, camPos3.z);

      const bp = groupLabelPlanes[i]; 
      const imgPos = c.mesh.position.clone();
      bp.position.x = imgPos.x; bp.position.z = imgPos.z;
      bp.material.opacity = 0.25 + 0.75 * c.prog;
      bp.lookAt(_camPos2D.x, bp.position.y, _camPos2D.z); 
      bp.rotateX(-0.12);
    }
  } else if (state === 'themeRoom') {
    const looked = roomWindow ? -1 : getLookedRoomLabel();
    for (let i = 0; i < roomLabels.length; i++) {
      const r = roomLabels[i]; 
      const target = (i === looked) ? 1 : 0; 
      r.prog += (target - r.prog) * 0.12;
      r.mesh.scale.setScalar(1 + 0.25 * r.prog);
      r.mesh.material.opacity = roomWindow ? 0.0 : (0.4 + 0.6 * r.prog);
      r.mesh.lookAt(_camPos2D.x, r.mesh.position.y, _camPos2D.z);
    }
  }

  handleInput(frame);
  renderer.render(scene, camera);
}

renderer.setAnimationLoop((time, frame) => { animate(time, frame); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
