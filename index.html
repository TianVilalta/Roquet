<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grup ROQUET - Exposició Virtual XR</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: sans-serif; color: white; }
  #info-panel { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 10px; text-align: center; pointer-events: none; border: 1px solid #333; z-index: 10; }
  h1 { margin: 0 0 5px 0; font-size: 20px; color: #00ffcc; }
  p { margin: 0; font-size: 14px; color: #aaa; }
</style>
</head>
<body>

<div id="info-panel">
  <h1>Grup ROQUET - Història i Futur</h1>
  <p>Mira fixament els panells de les sales per viatjar-hi o interactuar.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// --- CONFIGURACIÓ BÀSICA ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);
scene.fog = new THREE.FogExp2(0x0a0c10, 0.1);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
const cameraGroup = new THREE.Group(); // Contenidor per moure l'usuari entre sales
cameraGroup.position.set(0, 0, 0);
scene.add(cameraGroup);
cameraGroup.add(camera);

// Il·luminació
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const directional = new THREE.DirectionalLight(0x00ffcc, 0.8);
directional.position.set(0, 5, 5);
scene.add(directional);

// --- RAYCASTER PER A LA MIRADA (GAZE) ---
const raycaster = new THREE.Raycaster();
const centerScreen = new THREE.Vector2(0, 0);
let intersectedObject = null;
let gazeTimer = 0;

// Reticle visual al centre de la visió de l'usuari
const reticleGeo = new THREE.RingGeometry(0.01, 0.02, 32);
const reticleMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, depthTest: false, transparent: true, opacity: 0.8 });
const reticle = new THREE.Mesh(reticleGeo, reticleMat);
reticle.position.z = -2; // Posat a 2 metres de la càmera
camera.add(reticle);

// --- TEXTURES I TEXT EN LLAVORS EN CANVAS 2D (DISSENY SOL·LICITAT) ---
function crearTextPanel(titol, subtitol) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  // Fons rectangle negre
  ctx.fillStyle = '#000000';
  
  // Dibuixar vores arrodonides (radius 20)
  const r = 20;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(canvas.width - r, 0);
  ctx.quadraticCurveTo(canvas.width, 0, canvas.width, r);
  ctx.lineTo(canvas.width, canvas.height - r);
  ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - r, canvas.height);
  ctx.lineTo(r, canvas.height);
  ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Marje/Línia de contorn gris
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#555555';
  ctx.stroke();

  // Text Blanc - Títol
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(titol, canvas.width / 2, 90);

  // Text Blanc/Gris - Subtítol o descripció
  ctx.fillStyle = '#cccccc';
  ctx.font = '20px Arial';
  ctx.fillText(subtitol, canvas.width / 2, 160);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
  const geometry = new THREE.PlaneGeometry(1.5, 0.75);
  
  const mesh = new THREE.Mesh(geometry, material);
  mesh.userData = { originalScale: new THREE.Vector3(1, 1, 1), targetScale: new THREE.Vector3(1, 1, 1) };
  return mesh;
}

// --- CONFIGURACIÓ DE LES SALES (SALA PRINCIPAL I SUBSALES) ---
const loader = new GLTFLoader();
const salesData = [
  { id: 'principal', name: 'Sala Principal', pos: [0, 0, 0], titol: 'SALA PRINCIPAL', sub: 'Mira una secció per entrar' },
  { id: 'origens', name: 'Els orígens', pos: [0, 0, -15], titol: 'Els orígens', sub: 'Fundació i primers passos' },
  { id: 'creixement', name: 'El creixement', pos: [15, 0, 0], titol: 'El creixement', sub: 'Expansió industrial' },
  { id: 'grup', name: 'El Grup ROQUET', pos: [0, 0, 15], titol: 'El Grup ROQUET', sub: 'Subsales actuals (Tekor, Dinacil...)' },
  { id: 'impacte', name: 'L\'impacte', pos: [-15, 0, 0], titol: 'L\'impacte', sub: 'Presència global i mercat' },
  { id: 'futur', name: 'El futur', pos: [0, 15, 0], titol: 'El futur', sub: 'Innovació, R+D i sostenibilitat' }
];

const interactius = []; // Objectes que reaccionen a la mirada

salesData.forEach((sala) => {
  // 1. Carregar el model arquitectònic (Totes usen room.glb)
  loader.load('room.glb', (gltf) => {
    const model = gltf.scene;
    model.position.set(sala.pos[0], sala.pos[1], sala.pos[2]);
    scene.add(model);
  }, undefined, (error) => {
    // Fallback visual si room.glb triga a carregar o no es troba
    const fallbackGeo = new THREE.BoxGeometry(8, 4, 8);
    const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x1f2430, wireframe: true });
    const fallbackRoom = new THREE.Mesh(fallbackGeo, fallbackMat);
    fallbackRoom.position.set(sala.pos[0], sala.pos[1] + 2, sala.pos[2]);
    scene.add(fallbackRoom);
  });

  // 2. Creació del panell de text amb el disseny demanat
  const panel = crearTextPanel(sala.titol, sala.sub);
  
  if (sala.id === 'principal') {
    // Panell informatiu central de la sala d'inici
    panel.position.set(0, 1.6, -3);
    scene.add(panel);
  } else {
    // Els 5 panells de les noves sales es col·loquen al voltant de l'usuari a la sala principal
    // Calcularem una distribució circular a la Sala Principal
    const index = salesData.indexOf(sala) - 1; 
    const angle = (index / 5) * Math.PI * 2; // Repartits en cercle
    const radi = 4; // Distància respecte al centre (usuari)

    panel.position.set(Math.sin(angle) * radi, 1.5, Math.cos(angle) * radi);
    panel.lookAt(0, 1.5, 0); // Que mirin cap al centre on està l'usuari
    
    // Guardem dades per fer el teletransport i l'efecte de tamany al mirar
    panel.userData.tipus = 'teleport';
    panel.userData.destiPos = new THREE.Vector3(sala.pos[0], sala.pos[1], sala.pos[2]);
    panel.userData.originalScale.set(1, 1, 1);
    panel.userData.targetScale.set(1.2, 1.2, 1.2); // S'engrandeix un 20% al mirar-lo
    
    scene.add(panel);
    interactius.push(panel);

    // Dins de cada subsala, hi posem un botó de text per Tornar a la Sala Principal
    const botoTornar = crearTextPanel("TORNAR", "Torna a la sala d'inici");
    botoTornar.position.set(sala.pos[0], 1.5, sala.pos[2] - 3);
    botoTornar.lookAt(sala.pos[0], 1.5, sala.pos[2]);
    botoTornar.userData.tipus = 'teleport';
    botoTornar.userData.destiPos = new THREE.Vector3(0, 0, 0);
    botoTornar.userData.originalScale.set(1, 1, 1);
    botoTornar.userData.targetScale.set(1.1, 1.1, 1.1);
    
    scene.add(botoTornar);
    interactius.push(botoTornar);
  }
});


// --- BOTÓ WEBXR ---
document.body.appendChild(VRButton.createButton(renderer, { optionalFeatures: ['local-floor'] }));


// --- LÒGICA D'ACTUALITZACIÓ (ANIMATION LOOP) ---
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const delta = clock.getDelta();

  // 1. Configuració del Raycaster des de la direcció de la càmera (Gaze Tracking)
  const cameraDirection = new THREE.Vector3();
  camera.getWorldDirection(cameraDirection);
  raycaster.set(camera.getWorldPosition(new THREE.Vector3()), cameraDirection);

  const intersects = raycaster.intersectObjects(interactius);

  if (intersects.length > 0) {
    const object = intersects[0].object;

    // Si canviem d'objecte mirat
    if (intersectedObject !== object) {
      if (intersectedObject) {
        // El que estàvem mirant torna al seu tamany original
        intersectedObject.scale.copy(intersectedObject.userData.originalScale);
      }
      intersectedObject = object;
      gazeTimer = 0; // Reiniciar temporitzador d'activació
    }

    // Efecte visual: Anar escalant cap al tamany objectiu ("una mica més gran")
    intersectedObject.scale.lerp(intersectedObject.userData.targetScale, 0.1);
    
    // Canviar color del reticle per donar feedback
    reticle.material.color.setHex(0xff9900);

    // Comptador de mirada: si el mires fixament durant 2 segons, fa el canvi de sala
    gazeTimer += delta;
    if (gazeTimer >= 2.0) {
      if (intersectedObject.userData.tipus === 'teleport') {
        const desti = intersectedObject.userData.destiPos;
        cameraGroup.position.copy(desti); // Teletransport immediat de l'usuari
      }
      gazeTimer = 0;
    }
  } else {
    // Si no es mira res, es retorna l'estat original de l'últim panell seleccionat
    if (intersectedObject) {
      intersectedObject.scale.lerp(intersectedObject.userData.originalScale, 0.1);
      if (intersectedObject.scale.distanceTo(intersectedObject.userData.originalScale) < 0.01) {
        intersectedObject = null;
      }
    }
    reticle.material.color.setHex(0x00ffcc);
    gazeTimer = 0;
  }

  // Renderitzar
  renderer.render(scene, camera);
});

// Ajustar el tamany de la finestra per a desenvolupament en PC
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
