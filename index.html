<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebXR Grua Mecànica - Quest 3</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050505; font-family: sans-serif; color: white; }
  #info-panel { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 10px; text-align: center; pointer-events: none; border: 1px solid #333; }
  h1 { margin: 0 0 5px 0; font-size: 20px; color: #00ffcc; }
  p { margin: 0; font-size: 14px; color: #aaa; }
  canvas { display: block; }
</style>
</head>
<body>

<div id="info-panel">
  <h1>Simulador de Palanques XR</h1>
  <p>Entra en VR, utilitza els comandaments o les teves <b>mans reals</b> per moure les palanques.</p>
  <div id="vr-status" style="margin-top: 10px; font-weight: bold; color: #ff9900;">Comprovant WebXR...</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

// --- CONFIGURACIÓ DE L'ESCENA I RENDERER ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11141a);
scene.fog = new THREE.FogExp2(0x11141a, 0.15);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);

// --- IL·LUMINACIÓ STYLED (ESTIL INDUSTRIAL/JOC) ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(2, 5, 3);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const floorGrid = new THREE.GridHelper(20, 20, 0x00ffcc, 0x333333);
floorGrid.position.y = 0.01;
scene.add(floorGrid);

// Terra sòlid per rebre ombres
const floorGeo = new THREE.PlaneGeometry(30, 30);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// --- CONTEXT: LA CONSOLA DE CONTROL ---
const consoleGroup = new THREE.Group();
consoleGroup.position.set(0, 0.9, -0.5); // Just al davant de l'usuari a l'alçada de les mans
scene.add(consoleGroup);

// Base de la consola
const baseGeo = new THREE.BoxGeometry(0.6, 0.1, 0.3);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x2d323f, roughness: 0.5, metalness: 0.6 });
const baseMesh = new THREE.Mesh(baseGeo, baseMat);
baseMesh.castShadow = true;
baseMesh.receiveShadow = true;
consoleGroup.add(baseMesh);

// --- CREACIÓ DE LES PALANQUES (ESQUERRA I DRETA) ---
const palanques = [];

function crearPalanques() {
  const configuracions = [
    { name: 'Esquerra', xOffset: -0.15, color: 0xff3333 },
    { name: 'Dreta',    xOffset: 0.15,  color: 0x33ff33 }
  ];

  configuracions.forEach((config) => {
    const pGroup = new THREE.Group();
    pGroup.position.set(config.xOffset, 0.05, 0); // Posicionada sobre la base
    consoleGroup.add(pGroup);

    // Articulació esfèrica (Base de la palanca)
    const socketGeo = new THREE.SphereGeometry(0.03, 16, 16);
    const socketMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 });
    const socketMesh = new THREE.Mesh(socketGeo, socketMat);
    pGroup.add(socketMesh);

    // Part mòbil que rotarà (el pal + el pom)
    const partMobil = new THREE.Group();
    pGroup.add(partMobil);

    // El pal (mnec de la palanca)
    const rodGeo = new THREE.CylinderGeometry(0.008, 0.012, 0.25, 12);
    rodGeo.translate(0, 0.125, 0); // Moure el pivot a la base del cilindre
    const rodMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });
    const rodMesh = new THREE.Mesh(rodGeo, rodMat);
    rodMesh.castShadow = true;
    partMobil.add(rodMesh);

    // El pom (la bola superior on s'agafa)
    const knobGeo = new THREE.SphereGeometry(0.025, 16, 16);
    knobGeo.translate(0, 0.25, 0); // Posicionar a la punta del pal
    const knobMat = new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.6 });
    const knobMesh = new THREE.Mesh(knobGeo, knobMat);
    knobMesh.castShadow = true;
    partMobil.add(knobMesh);

    // Guardem la referència de la palanca per a les col·lisions de joc
    palanques.push({
      name: config.name,
      baseWorldPos: new THREE.Vector3(),
      knobWorldPos: new THREE.Vector3(),
      partMobil: partMobil,
      angleX: 0, // Rotació endavant / enrere
      angleZ: 0, // Rotació esquerra / dreta
      targetAngleX: 0,
      targetAngleZ: 0,
      isGrabbed: false,
      grabbingController: null
    });
  });
}
crearPalanques();

// --- VISUALITZACIÓ DE FEEDBACK DE JOC (DUE TORRES S'ENLAIREN) ---
// Creem dos cubs grans al fons que es mouran segons la posició de les palanques
const torres = [];
const torreGeo = new THREE.BoxGeometry(0.4, 2, 0.4);
torreGeo.translate(0, 1, 0);

const torreEsquerra = new THREE.Mesh(torreGeo, new THREE.MeshStandardMaterial({ color: 0xff3333, metalness: 0.2 }));
torreEsquerra.position.set(-1.5, 0, -2);
torreEsquerra.castShadow = true;
scene.add(torreEsquerra);

const torreDreta = new THREE.Mesh(torreGeo, new THREE.MeshStandardMaterial({ color: 0x33ff33, metalness: 0.2 }));
torreDreta.position.set(1.5, 0, -2);
torreDreta.castShadow = true;
scene.add(torreDreta);


// --- CONFIGURACIÓ DE LES MANS I COMANDAMENTS XR ---
const controllerModelFactory = new XRControllerModelFactory();
const handModelFactory = new XRHandModelFactory();

// Configurar controladors tradicionals (per si s'usen els comandaments de la Quest)
const controller1 = renderer.xr.getController(0);
scene.add(controller1);
const controller2 = renderer.xr.getController(1);
scene.add(controller2);

const controllerGrip1 = renderer.xr.getControllerGrip(0);
controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
scene.add(controllerGrip1);

const controllerGrip2 = renderer.xr.getControllerGrip(1);
controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
scene.add(controllerGrip2);

// Configurar Mans Reals (Hand Tracking) bàsic de Three.js
const hand1 = renderer.xr.getHand(0);
hand1.add(handModelFactory.createHandModel(hand1, "mesh"));
scene.add(hand1);

const hand2 = renderer.xr.getHand(1);
hand2.add(handModelFactory.createHandModel(hand2, "mesh"));
scene.add(hand2);

// Afegim esferes invisibles a la punta dels controladors o índexs de les mans per fer col·lisions directes (estil "tocar i arrossegar")
const tipGeo = new THREE.SphereGeometry(0.02, 8, 8);
const tipMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, visible: false }); // Fes-lo visible: true si vols depurar

const interactors = [];
[controller1, controller2, hand1, hand2].forEach((inputSource) => {
  const tipMesh = new THREE.Mesh(tipGeo, tipMat);
  inputSource.add(tipMesh);
  interactors.push({
    source: inputSource,
    tip: tipMesh,
    worldPosition: new THREE.Vector3(),
    isSqueezing: false // Per a comandaments es pot usar el gallet, per a mans col·lisió directa per proximitat
  });
});

// Detectar quan s'acciona el gallet dels comandaments
function onSelectStart(event) {
  const controller = event.target;
  const interactor = interactors.find(i => i.source === controller);
  if (interactor) interactor.isSqueezing = true;
}
function onSelectEnd(event) {
  const controller = event.target;
  const interactor = interactors.find(i => i.source === controller);
  if (interactor) interactor.isSqueezing = false;
}
controller1.addEventListener('selectstart', onSelectStart);
controller1.addEventListener('selectend', onSelectEnd);
controller2.addEventListener('selectstart', onSelectStart);
controller2.addEventListener('selectend', onSelectEnd);


// --- BOTÓ VR ---
const vrButton = VRButton.createButton(renderer, {
  requiredFeatures: ['local-floor'],
  optionalFeatures: ['hand-tracking']
});
document.body.appendChild(vrButton);

const statusDiv = document.getElementById('vr-status');
if (navigator.xr) {
  statusDiv.textContent = "Dispositiu WebXR preparat. Prem 'ENTER VR'.";
} else {
  statusDiv.textContent = "WebXR no detectat. Fes servir el navegador de la Meta Quest 3.";
}


// --- LÒGICA D'INTERACCIÓ I ANIMACIÓ DE FILTRE ---
const maxAngle = 0.6; // Límit físic de moviment de la palanca (~35 graus)

function processInteractions() {
  // Actualitzar posicions del món per a tots els interactors i poms de palanques
  interactors.forEach((interactor) => {
    interactor.tip.getWorldPosition(interactor.worldPosition);
  });

  palanques.forEach((palanca) => {
    // Obtenir la posició real en l'espai 3D de la base i del pom superior
    palanca.partMobil.children[1].getWorldPosition(palanca.knobWorldPos); 
    palanca.partMobil.getWorldPosition(palanca.baseWorldPos);

    let algunInteractorAprop = false;

    interactors.forEach((interactor) => {
      // Si la font és una mà, comprovem la punta del dit índex si s'està fent el gest de pinça, 
      // o per simplificar el joc: interacció directa per proximitat de menys de 6 cm.
      const dist = interactor.worldPosition.distanceTo(palanca.knobWorldPos);
      
      // Condició d'agafar: estar molt a prop (menys de 6cm)
      if (dist < 0.06) {
        algunInteractorAprop = true;
        
        // Si no estava agafada, l'atrapem
        if (!palanca.isGrabbed) {
          palanca.isGrabbed = true;
          palanca.grabbingController = interactor;
        }
      }
    });

    // Si està agafada, calculem cap a on apunta la mà respecte a la base de la palanca
    if (palanca.isGrabbed) {
      const handPos = palanca.grabbingController.worldPosition;
      
      // Vector des de la base de la palanca cap a la mà de l'usuari
      const localTarget = consoleGroup.worldToLocal(handPos.clone()).sub(consoleGroup.worldToLocal(palanca.baseWorldPos.clone()));

      // Calculem els angles d'inclinació target basats en la posició de la mà
      // Z local controla rotació a l'eix X (Endavant/Enrere)
      // X local controla rotació a l'eix Z (Esquerra/Dreta)
      palanca.targetAngleX = Math.max(-maxAngle, Math.min(maxAngle, localTarget.z * 4));
      palanca.targetAngleZ = Math.max(-maxAngle, Math.min(maxAngle, -localTarget.x * 4));

      // Deixar anar si la mà s'allunya massa (més de 15cm)
      const distAncoratge = handPos.distanceTo(palanca.knobWorldPos);
      if (distAncoratge > 0.15) {
        palanca.isGrabbed = false;
        palanca.grabbingController = null;
      }
    } else {
      // Retorn automàtic al centre (estil molla mecànica de joc)
      palanca.targetAngleX *= 0.85;
      palanca.targetAngleZ *= 0.85;
    }

    // Amortiment (Smooth lerp) de la rotació de les palanques per donar sensació de pes real
    palanca.angleX += (palanca.targetAngleX - palanca.angleX) * 0.2;
    palanca.angleZ += (palanca.targetAngleZ - palanca.angleZ) * 0.2;

    // Aplicar les rotacions a la peça mòbil 3D
    palanca.partMobil.rotation.set(palanca.angleX, 0, palanca.angleZ);
  });
}

// --- BUCLE PRINCIPAL DE JOC ---
function animate() {
  renderer.setAnimationLoop((timestamp, frame) => {
    
    // Processar el moviment i agafada de les palanques amb les mans reals
    processInteractions();

    // MODIFICAR EL JOC EN FUNCIÓ DE LES PALANQUES:
    // La palanca Esquerra (palanques[0]) mou l'alçada de la torre Esquerra
    // L'eix X (endavant/enrere) altera l'escala en Y
    const factorEsquerra = (palanques[0].angleX / maxAngle); // Valor entre -1 i 1
    torreEsquerra.scale.y = 1 + (factorEsquerra * 0.8);
    torreEsquerra.material.color.setHex(palanques[0].isGrabbed ? 0xffaa00 : 0xff3333);

    // La palanca Dreta (palanques[1]) mou l'alçada de la torre Dreta
    const factorDret = (palanques[1].angleX / maxAngle);
    torreDreta.scale.y = 1 + (factorDret * 0.8);
    torreDreta.material.color.setHex(palanques[1].isGrabbed ? 0xffaa00 : 0x33ff33);

    // Renderitzar l'escena
    renderer.render(scene, camera);
  });
}

animate();

// Ajustar tamany de pantalla per si es veu en mode monitor de PC/Desenvolupament
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
