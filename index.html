function onHeadsetVisibilityChange(event) {
  const state = event?.session?.visibilityState || renderer.xr.getSession()?.visibilityState;
  if (state === 'hidden' || state === 'visible' || state === 'visible-blurred') {
    markHeadsetOffOrPaused();
  }
}

function onDocumentVisibilityChange() {
  if (document.visibilityState === 'visible' || document.visibilityState === 'hidden') {
    markHeadsetOffOrPaused();
  }
}

function attachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (!session || headsetVisibilityHandlerAttached) return;
  session.addEventListener('visibilitychange', onHeadsetVisibilityChange);
  document.addEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = true;
}

function detachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (session) {
    session.removeEventListener('visibilitychange', onHeadsetVisibilityChange);
  }
  document.removeEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = false;
}

// ─── OPTIMITZACIÓ DE CARREGA D'IMATGES I TEXTURES ─────────────────────────
const textureCache = new Map();
let placeholderTexture = null;

function createPlaceholderTexture() {
  if (placeholderTexture) return placeholderTexture;
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  
  // Subtle dark glassy gradient for placeholders instead of blank white
  const grad = ctx.createLinearGradient(0, 0, 128, 128);
  grad.addColorStop(0, '#1a2332');
  grad.addColorStop(1, '#0c1017');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 128, 128);

  ctx.strokeStyle = 'rgba(244, 162, 97, 0.4)';
  ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, 120, 120);

  placeholderTexture = new THREE.CanvasTexture(canvas);
  placeholderTexture.generateMipmaps = false;
  placeholderTexture.minFilter = THREE.LinearFilter;
  return placeholderTexture;
}

function loadOptimizedTexture(url, onLoaded) {
  if (textureCache.has(url)) {
    const cached = textureCache.get(url);
    if (onLoaded) onLoaded(cached.texture, cached.width, cached.height);
    return cached.texture;
  }

  const img = new Image();
  img.decoding = 'async';
  img.src = url;

  const texture = new THREE.Texture(img);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.generateMipmaps = false; 
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  img.onload = () => {
    texture.needsUpdate = true;
    const w = img.naturalWidth || 512;
    const h = img.naturalHeight || 512;
    textureCache.set(url, { texture, width: w, height: h });
    if (onLoaded) onLoaded(texture, w, h);
  };

  img.onerror = (err) => {
    console.warn(`Error carregant imatge ${url}:`, err);
  };

  return texture;
}

// Pre-carrega en segon pla (background preloading) per a zero retards
function preloadGalleryImagesInBackground() {
  const allUrls = [];
  hubItems.forEach(item => allUrls.push(item.img));
  
  Object.values(companyGalleries).forEach(categories => {
    Object.values(categories).forEach(list => {
      list.forEach(url => allUrls.push(url));
    });
  });

  let index = 0;
  function processQueue() {
    const start = performance.now();
    while (index < allUrls.length && performance.now() - start < 8) {
      const url = allUrls[index++];
      if (!textureCache.has(url)) {
        loadOptimizedTexture(url);
      }
    }
    if (index < allUrls.length) {
      if (window.requestIdleCallback) {
        requestIdleCallback(processQueue);
      } else {
        setTimeout(processQueue, 50);
      }
    }
  }

  setTimeout(processQueue, 500);
}

preloadGalleryImagesInBackground();

// Helper neteja de grups
function clearGroup(g) {
  while (g.children.length) {
    const c = g.children[0];
    g.remove(c);
    c.geometry?.dispose();
    if (c.material) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => {
        // We keep textures in cache, don't dispose shared maps
        m.dispose();
      });
    }
  }
}

  if (_fwd.lengthSq() > 0) {
    const angle = Math.atan2(_fwd.x, _fwd.z);
    mainHubGroup.rotation.y = angle - Math.PI;
  }
}

const mainPanels = [];
const MAIN_RADIUS = 2.8;
const IMAGE_Y = 1.2;

function createMainHubPanels() {
  clearGroup(mainHubGroup);
  mainPanels.length = 0;
  const pTex = createPlaceholderTexture();

  for (let i = 0; i < hubItems.length; i++) {
    const angle = (i / hubItems.length) * Math.PI * 2;
    const x = Math.sin(angle) * MAIN_RADIUS;
    const z = -Math.cos(angle) * MAIN_RADIUS;
    const item = hubItems[i];

    const mat = new THREE.MeshBasicMaterial({ 
      map: pTex,
      transparent: true, 
      opacity: 0.85,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), mat);
    mesh.visible = true; 
    mesh.position.set(x, IMAGE_Y, z);
    mesh.lookAt(0, IMAGE_Y, 0);
    mainHubGroup.add(mesh);

    loadOptimizedTexture(item.img, (tex, iw, ih) => {
      mesh.material.map = tex;
      mesh.material.needsUpdate = true;

      const w = 0.9;
      const h = w * (ih / iw);

      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(w, h);
      mesh.material.opacity = 1.0;
    });

    mainPanels.push({ mesh, item, index: i, prog: 0 });
  }
}

// Funció per generar targetes de menú ultra-professionals
function createProfessionalLabelTexture(text) {
  const lc = document.createElement('canvas'); 
  lc.width = 512; 
  lc.height = 160;
  const ctx = lc.getContext('2d');
  
  ctx.clearRect(0, 0, lc.width, lc.height);

  const x = 12, y = 12, w = 488, h = 136, r = 24;

  // 1. Fons Glassmorphic (Degradat obscur de fons)
  const bgGrad = ctx.createLinearGradient(0, 0, 0, lc.height);
  bgGrad.addColorStop(0, 'rgba(20, 26, 38, 0.92)');
  bgGrad.addColorStop(1, 'rgba(8, 12, 18, 0.96)');

  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = bgGrad;
  ctx.fill();

  // 2. Brillantor interior / il·luminació superior
  const topGlow = ctx.createLinearGradient(0, y, 0, y + 45);
  topGlow.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
  topGlow.addColorStop(1, 'rgba(255, 255, 255, 0.0)');
  ctx.beginPath();
  ctx.roundRect(x + 2, y + 2, w - 4, 45, [r - 2, r - 2, 0, 0]);
  ctx.fillStyle = topGlow;
  ctx.fill();

  // 3. Marc exterior fi amb accent daurat/taronja de la marca
  const borderGrad = ctx.createLinearGradient(0, 0, lc.width, lc.height);
  borderGrad.addColorStop(0, '#f4a261');
  borderGrad.addColorStop(0.5, 'rgba(244, 162, 97, 0.3)');
  borderGrad.addColorStop(1, '#e76f51');

  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.lineWidth = 3;
  ctx.strokeStyle = borderGrad;
  ctx.stroke();

  // 4. Accent lateral cromàtic primari
  ctx.beginPath();
  ctx.roundRect(x + 14, y + 24, 6, h - 48, 3);
  ctx.fillStyle = '#f4a261';
  ctx.fill();

  // 5. Ombra de text i Tipografia refinada
  ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 3;

  ctx.fillStyle = '#ffffff';
  ctx.font = '600 36px "Segoe UI", Roboto, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // Centrat offsetat per compensar l'accent lateral
  ctx.fillText(text, (x + w / 2) + 10, y + h / 2);

  const canvasTex = new THREE.CanvasTexture(lc);
  canvasTex.generateMipmaps = false;
  canvasTex.minFilter = THREE.LinearFilter;
  return canvasTex;
}

function buildThemeRoom(companyId) {
  currentSelectedCompany = companyId;
  clearGroup(roomGroup);
  closeCarousel();
  roomLabels.length = 0; 

  // Col·locar el grup de la sala a la posició de la càmera
  camera.getWorldPosition(_cam);
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  _fwd.normalize();

  roomGroup.position.set(_cam.x, 0, _cam.z);

  // Orienta la sala de manera que la direcció -Z del grup coincideixi amb la mirada actual
  if (_fwd.lengthSq() > 0) {
    const angle = Math.atan2(_fwd.x, _fwd.z);
    roomGroup.rotation.y = angle - Math.PI;
  }

  // Definim les 3 categories: 'Producte' primer per situar-lo directament al davant
  const labels = ['Producte', 'Edifici', 'Instalacions'];
  const RL_RADIUS = 2.5;
  const RL_Y = 1.2;

  // L'angle 0 queda a (0, 1.2, -RL_RADIUS), és a dir, exactament DAVANT la mirada de l'usuari.
  // Es distribueixen de forma simètrica: Producte (0°), Edifici (+120°), Instalacions (-120°)
  const angleOffsets = [0, (Math.PI * 2) / 3, -(Math.PI * 2) / 3];

  for (let i = 0; i < labels.length; i++) {
    const angle = angleOffsets[i];
    const lx = Math.sin(angle) * RL_RADIUS;
    const lz = -Math.cos(angle) * RL_RADIUS;

    const ltex = createProfessionalLabelTexture(labels[i]);
    const lmesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1.35, 0.42), 
      new THREE.MeshBasicMaterial({ map: ltex, transparent: true, side: THREE.DoubleSide })
    );
    
    lmesh.position.set(lx, RL_Y, lz);
    lmesh.lookAt(0, RL_Y, 0);
    lmesh.material.opacity = 0.85;
    
    roomGroup.add(lmesh);
    roomLabels.push({ mesh: lmesh, index: i, categoryKey: labels[i], prog: 0 });
  }

  mainHubGroup.visible = false;
  roomGroup.visible = true;
  state = 'themeRoom';
}

function openCarouselCategory(categoryKey) {
  clearGroup(carouselGroup);
  carouselItems = [];
  carouselGroup.rotation.y = 0; 

  const companyData = companyGalleries[currentSelectedCompany];
  const imageList = (companyData && companyData[categoryKey]) ? companyData[categoryKey] : [];
  
  if (imageList.length === 0) {
    console.warn(`No hi ha imatges per a ${currentSelectedCompany} -> ${categoryKey}`);
    return;
  }

  camera.getWorldPosition(_cam);
  carouselGroup.position.set(_cam.x, 0, _cam.z);

  const count = imageList.length;
  const pTex = createPlaceholderTexture();

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const basePos = new THREE.Vector3(
      Math.sin(angle) * CAROUSEL_RADIUS,
      1.2,
      -Math.cos(angle) * CAROUSEL_RADIUS
    );

    const mat = new THREE.MeshBasicMaterial({ 
      map: pTex,
      side: THREE.DoubleSide, 
      transparent: true,
      opacity: 0.6
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.9), mat);
    mesh.position.copy(basePos);
    mesh.lookAt(0, 1.2, 0);
    carouselGroup.add(mesh);

    const itemObj = {
      mesh,
      basePos: basePos.clone(),
      prog: 0,
      loaded: false
    };

    loadOptimizedTexture(imageList[i], (tex, iw, ih) => {
      mesh.material.map = tex;
      mesh.material.needsUpdate = true;

      const w = 1.2;
      const h = w * (ih / iw);

      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(w, h);
      mesh.material.opacity = 0.95;
      itemObj.loaded = true;
    });

    carouselItems.push(itemObj);
  }

  roomGroup.visible = false;
  carouselGroup.visible = true;
  state = 'carousel';
}

function closeCarousel() {
  clearGroup(carouselGroup);
  carouselGroup.visible = false;
  carouselItems = [];
  if (state === 'carousel') {
    roomGroup.visible = true;
    state = 'themeRoom';
  }
}

// ─── NAVEGACIÓ I SORTIDA ───────────────────────────────────────────────
function exitToMainHub() {
  closeCarousel();
  clearGroup(roomGroup);
  roomGroup.visible = false;
  mainHubGroup.visible = true;
  currentSelectedCompany = null;
  state = 'mainHub';
}

function getLookedMainPanel() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.72;
  for (let i = 0; i < mainPanels.length; i++) {
    if (!mainPanels[i].mesh.visible) continue;
    mainPanels[i].mesh.getWorldPosition(_itemWorldPos);
    _to.copy(_itemWorldPos).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

function getLookedRoomLabel() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.7;
  for (let i = 0; i < roomLabels.length; i++) {
    roomLabels[i].mesh.getWorldPosition(_itemWorldPos);
    _to.copy(_itemWorldPos).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

function getLookedCarouselItem() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.8;
  for (let i = 0; i < carouselItems.length; i++) {
    carouselItems[i].mesh.getWorldPosition(_itemWorldPos);
    _to.copy(_itemWorldPos).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

// ─── BOTÓ WEBXR AR ─────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
statusEl.textContent = 'Comprovant WebXR AR...';

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then(supported => {
    if (supported) {
      statusEl.textContent = 'Llest! Prem "START AR" per entrar a la sala.';
      document.body.appendChild(ARButton.createButton(renderer, { optionalFeatures: ['local-floor', 'bounded-floor'] }));
    } else {
      statusEl.textContent = 'AR no suportat en aquest navegador.';
    }
  });
}

// ─── INPUTS I JOYSTICK CONTINU ─────────────────────────────────────────
const infoEl = document.getElementById('controllerInfo');

function handleInput(delta, frame) {
  const session = renderer.xr.getSession(); if (!session) return;
  const refSpace = renderer.xr.getReferenceSpace(); let anyController = false;

  for (const src of session.inputSources) {
    if (!src.gamepad) continue;
    if (frame && refSpace) {
      const space = src.gripSpace || src.targetRaySpace;
      if (space) {
        const pose = frame.getPose(space, refSpace);
        if (pose) { anyController = true; }
      }
    }
    if (src.handedness !== 'right') continue;
    const gp = src.gamepad; 
    const aPressed = gp.buttons[4]?.pressed; 
    const bPressed = gp.buttons[5]?.pressed;

    // MOVIMENT DEL JOYSTICK DRET
    const axisX = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];
    if (axisX !== undefined) {
      const deadzone = 0.15;
      if (Math.abs(axisX) > deadzone) {
        const sign = Math.sign(axisX);
        const normalizedInput = (Math.abs(axisX) - deadzone) / (1.0 - deadzone);
        const maxTurnSpeed = 1.5; 

        if (state === 'carousel' && carouselGroup.visible) {
          carouselGroup.rotation.y -= sign * normalizedInput * maxTurnSpeed * delta;
        } else {
          cameraGroup.rotation.y -= sign * normalizedInput * maxTurnSpeed * delta;
        }
      }
    }

    if (aPressed && !buttonStates.a) {
      if (state === 'mainHub') {
        const idx = getLookedMainPanel();
        if (idx !== -1) {
          buildThemeRoom(hubItems[idx].id);
        }
      } else if (state === 'themeRoom') {
        const ridx = getLookedRoomLabel();
        if (ridx !== -1) {
          openCarouselCategory(roomLabels[ridx].categoryKey);
        }
      }
    }

    if (bPressed && !buttonStates.b) {
      if (state === 'carousel') {
        closeCarousel();
      } else if (state === 'themeRoom') {
        exitToMainHub();
      }
    }

    buttonStates.a = aPressed; 
    buttonStates.b = bPressed;
  }
  if(infoEl) infoEl.textContent = anyController ? 'Mandos actius' : 'Mandos: buscant...';
}

// ─── BUCLE D'ANIMACIÓ ──────────────────────────────────────────────────
let lastClockTime = performance.now();

function animate(time, frame) {
  const now = performance.now();
  const delta = Math.min((now - lastClockTime) / 1000, 0.1); 
  lastClockTime = now;

  if (pendingHubRecenter && renderer.xr.getSession() && frame) { 
    recenterVR(); 
    pendingHubRecenter = false; 
  }

  camera.getWorldPosition(_camPos2D);

  if (state === 'mainHub') {
    const looked = getLookedMainPanel();
    for (let i = 0; i < mainPanels.length; i++) {
      const p = mainPanels[i];
      if (!p.mesh.visible) continue;
      const target = (i === looked) ? 1 : 0;
      p.prog += (target - p.prog) * 0.12;
      p.mesh.scale.setScalar(1 + 0.18 * p.prog);
      const camPos3 = new THREE.Vector3(); 
      camera.getWorldPosition(camPos3); 
      p.mesh.lookAt(camPos3.x, camPos3.y - 0.1, camPos3.z);
    }
  } else if (state === 'themeRoom') {
    const looked = getLookedRoomLabel();
    for (let i = 0; i < roomLabels.length; i++) {
      const r = roomLabels[i]; 
      const target = (i === looked) ? 1 : 0; 
      r.prog += (target - r.prog) * 0.12;
      
      const currentScale = 1 + 0.22 * r.prog;
      r.mesh.scale.setScalar(currentScale);
      r.mesh.material.opacity = 0.75 + 0.25 * r.prog;
      r.mesh.lookAt(_camPos2D.x, r.mesh.position.y, _camPos2D.z);
    }
  } else if (state === 'carousel' && carouselGroup.visible) {
    const lookedIdx = getLookedCarouselItem();
    for (let i = 0; i < carouselItems.length; i++) {
      const item = carouselItems[i];
      const target = (i === lookedIdx) ? 1 : 0;
      
      item.prog += (target - item.prog) * 0.12;
      item.mesh.scale.setScalar(1 + 0.25 * item.prog);

      const moveDir = item.basePos.clone().normalize();
      const targetPos = item.basePos.clone().sub(moveDir.multiplyScalar(0.6 * item.prog));
      item.mesh.position.copy(targetPos);
    }
  }

  handleInput(delta, frame);
  renderer.render(scene, camera);
}

renderer.setAnimationLoop((time, frame) => { animate(time, frame); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
