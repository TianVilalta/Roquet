<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roquet AR - Dinacil Gallery</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
    color: white;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 20px;
    pointer-events: none;
    color: #fff;
  }
  #status { margin-top: 10px; font-size: 14px; color: #ccc; }
  #controllerInfo {
    position: absolute;
    top: 10px; left: 10px;
    font-size: 12px;
    line-height: 1.6;
    background: rgba(0,0,0,0.55);
    padding: 8px 14px;
    border-radius: 8px;
    pointer-events: none;
    white-space: pre;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="overlay">
  <h2>Dinacil AR — Quest 3</h2>
  <div id="status">Carregant...</div>
</div>
<div id="controllerInfo">Mandos: esperant sessió AR...</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script>
  window.addEventListener('error', e => {
    const s = document.getElementById('status');
    if (s) { s.textContent = 'Error: ' + (e.message || e); s.style.color = '#f66'; }
  });
  window.addEventListener('unhandledrejection', e => {
    const s = document.getElementById('status');
    if (s) { s.textContent = 'Error: ' + (e.reason?.message ?? e.reason); s.style.color = '#f66'; }
  });
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ─── ESTATS DE NAVEGACIÓ ──────────────────────────────────────────────
let state = 'mainHub';  
const buttonStates = {};
const roomLabels = [];

const _fwd = new THREE.Vector3();
const _cam = new THREE.Vector3();
const _to  = new THREE.Vector3();
const _camPos2D = new THREE.Vector3();

// ─── RENDERITZADOR I ESCENA ───────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ 
  antialias: true, 
  alpha: true,
  powerPreference: "high-performance" 
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

const scene = new THREE.Scene();
scene.background = null;

const cameraGroup = new THREE.Group();
scene.add(cameraGroup);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 300);
cameraGroup.add(camera);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

let headsetVisibilityHandlerAttached = false;
let pendingHubRecenter = false;

function recenterVR() {
  recenterMainHubAroundUser();
  const session = renderer.xr.getSession();
  if (session) {
    session.requestReferenceSpace('local-floor').then((refSpace) => {
      renderer.xr.setReferenceSpace(refSpace);
    }).catch(() => {});
  }
}

renderer.xr.addEventListener('sessionstart', () => {
  resetToMainHub();
  attachHeadsetVisibilityHandler();
});
renderer.xr.addEventListener('sessionend', () => {
  resetToMainHub();
  detachHeadsetVisibilityHandler();
});
document.body.appendChild(renderer.domElement);

function resetToMainHub() {
  exitToMainHub();
  recenterVR();
  pendingHubRecenter = true;
}

function markHeadsetOffOrPaused() {
  resetToMainHub();
}

function onHeadsetVisibilityChange(event) {
  const state = event?.session?.visibilityState || renderer.xr.getSession()?.visibilityState;
  if (state === 'hidden' || state === 'visible' || state === 'visible-blurred') {
    markHeadsetOffOrPaused();
  }
}

function onDocumentVisibilityChange() {
  if (document.visibilityState === 'visible' || document.visibilityState === 'hidden') {
    markHeadsetOffOrPaused();
  }
}

function attachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (!session || headsetVisibilityHandlerAttached) return;
  session.addEventListener('visibilitychange', onHeadsetVisibilityChange);
  document.addEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = true;
}

function detachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (session) {
    session.removeEventListener('visibilitychange', onHeadsetVisibilityChange);
  }
  document.removeEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = false;
}

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(hemiLight);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight1.position.set(5, 12, 6);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight2.position.set(-5, 8, -6);
scene.add(dirLight2);

const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

// ─── DADES DE LES SECCIONS I IMATGES (RUTES A ./logos/) ───────────────────
const hubItems = [
  { label: 'Amèrica', img: './logos/america.png', id: 'america' },
  { label: 'Pedro', img: './logos/pedro.png', id: 'pedro' },
  { label: 'Eastern', img: './logos/eastern.png', id: 'eastern' },
  { label: 'Dinacil', img: './logos/dinacil.png', id: 'dinacil' },
  { label: 'Fundiciones', img: './logos/fundiciones.png', id: 'fundiciones' },
  { label: 'Tekor', img: './logos/tekor.png', id: 'tekor' }
];

const dinacilCategories = {
  Edifici: [
    './DEdifici1.jpg',
    './DEdifici2.jpg',
    './DEdifici3.jpg',
    './DEdifici4.JPG',
    './DEdifici5.JPG',
    './DEdifici6.JPG',
    './DEdifici7.JPG',
    './DEdifici8.JPG',
    './DEdifici9.JPG',
    './DEdifici10.JPG',
    './DEdifici11.JPG',
    './DEdifici12.JPG',
    './DEdifici13.jpg',
    './DEdifici14.jpg'
  ],
  Instalacions: [
    './DInstalacions1.jpg',
    './DInstalacions2.jpg',
    './DInstalacions3.jpg',
    './DInstalacions4.jpg',
    './DInstalacions5.jpg',
    './DInstalacions6.jpg',
    './DInstalacions7.jpg',
    './DInstalacions8.jpg',
    './DInstalacions9.jpg',
    './DInstalacions10.jpg',
    './DInstalacions11.jpg',
    './DInstalacions12.jpg',
    './DInstalacions13.jpg',
    './DInstalacions14.jpg',
    './DInstalacions15.jpg',
    './DInstalacions16.jpg',
    './DInstalacions17.jpg',
    './DInstalacions18.jpg',
    './DInstalacions19.jpg',
    './DInstalacions20.jpg',
    './DInstalacions21.jpg'
  ],
  Producte: [
    './DProducte1.png',
    './DProducte2.png',
    './DProducte3.png',
    './DProducte4.png',
    './DProducte5.png',
    './DProducte6.jpg',
    './DProducte7.jpg',
    './DProducte8.jpg',
    './DProducte9.jpg'
  ]
};

// Helper neteja de grups
function clearGroup(g) {
  while (g.children.length) {
    const c = g.children[0];
    g.remove(c);
    c.geometry?.dispose();
    if (c.material) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => {
        if (m.map) m.map.dispose();
        m.dispose();
      });
    }
  }
}

// ─── MAIN HUB ──────────────────────────────────────────────────────────
const mainHubGroup = new THREE.Group();
scene.add(mainHubGroup);

function recenterMainHubAroundUser() {
  camera.getWorldPosition(_cam);
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  _fwd.normalize();

  mainHubGroup.position.set(_cam.x, 0, _cam.z);
  
  if (_fwd.lengthSq() > 0) {
    const angle = Math.atan2(_fwd.x, _fwd.z);
    mainHubGroup.rotation.y = angle - Math.PI;
  }
}

const mainPanels = [];
const MAIN_RADIUS = 2.8;
const IMAGE_Y = 1.2;

function createMainHubPanels() {
  clearGroup(mainHubGroup);
  mainPanels.length = 0;
  const loader = new THREE.TextureLoader();

  for (let i = 0; i < hubItems.length; i++) {
    const angle = (i / hubItems.length) * Math.PI * 2;
    const x = Math.sin(angle) * MAIN_RADIUS;
    const z = -Math.cos(angle) * MAIN_RADIUS;
    const item = hubItems[i];

    const mat = new THREE.MeshBasicMaterial({ 
      transparent: true, 
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 0.1), mat);
    mesh.visible = false; 
    mesh.position.set(x, IMAGE_Y, z);
    mesh.lookAt(0, IMAGE_Y, 0);
    mainHubGroup.add(mesh);

    loader.load(
      item.img, 
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        mesh.material.map = tex;
        mesh.material.needsUpdate = true;

        const iw = tex.image?.naturalWidth || 512;
        const ih = tex.image?.naturalHeight || 512;
        const w = 0.9;
        const h = w * (ih / iw);

        mesh.geometry.dispose();
        mesh.geometry = new THREE.PlaneGeometry(w, h);
        mesh.visible = true;
      },
      undefined,
      (err) => {
        console.warn(`Error en carregar la imatge ${item.img}:`, err);
      }
    );

    mainPanels.push({ mesh, item, index: i, prog: 0 });
  }
}

createMainHubPanels();

// ─── SALA DINACIL I CARRUSEL INFINIT ──────────────────────────────────
const roomGroup = new THREE.Group();
roomGroup.visible = false;
scene.add(roomGroup);

const carouselGroup = new THREE.Group();
carouselGroup.visible = false;
scene.add(carouselGroup);

let carouselItems = [];
const CAROUSEL_RADIUS = 3.2;

function buildThemeRoom() {
  clearGroup(roomGroup);
  closeCarousel();
  roomLabels.length = 0; 

  camera.getWorldPosition(_cam);
  roomGroup.position.set(_cam.x, 0, _cam.z);

  const labels = ['Edifici', 'Instalacions', 'Producte'];
  const RL_RADIUS = 2.5;
  const RL_Y = 1.2;

  for (let i = 0; i < labels.length; i++) {
    const angle = (i / labels.length) * Math.PI * 2;
    const lx = Math.sin(angle) * RL_RADIUS;
    const lz = -Math.cos(angle) * RL_RADIUS;

    const lc = document.createElement('canvas'); lc.width = 256; lc.height = 64;
    const lctx = lc.getContext('2d');
    lctx.clearRect(0,0,lc.width,lc.height);
    lctx.beginPath(); lctx.roundRect(4,4,248,56,12); lctx.closePath();
    lctx.fillStyle = 'rgba(15, 17, 21, 0.85)'; lctx.fill();
    lctx.strokeStyle = '#f4a261'; lctx.lineWidth = 3; lctx.stroke();
    lctx.fillStyle = '#ffffff'; lctx.font = 'bold 22px Arial'; lctx.textAlign = 'center';
    lctx.fillText(labels[i], lc.width/2, lc.height/2 + 8);

    const ltex = new THREE.CanvasTexture(lc);
    const lmesh = new THREE.Mesh(
      new THREE.PlaneGeometry(1.2, 0.3), 
      new THREE.MeshBasicMaterial({ map: ltex, transparent: true, side: THREE.DoubleSide })
    );
    lmesh.position.set(lx, RL_Y, lz);
    lmesh.lookAt(0, RL_Y, 0);
    lmesh.material.opacity = 0.7;
    
    roomGroup.add(lmesh);
    roomLabels.push({ mesh: lmesh, index: i, categoryKey: labels[i], prog: 0 });
  }

  mainHubGroup.visible = false;
  roomGroup.visible = true;
  state = 'themeRoom';
}

function openCarouselCategory(categoryKey) {
  clearGroup(carouselGroup);
  carouselItems = [];
  carouselGroup.rotation.y = 0; // Reset rotació al carregar

  const imageList = dinacilCategories[categoryKey] || [];
  if (imageList.length === 0) return;

  camera.getWorldPosition(_cam);
  carouselGroup.position.set(_cam.x, 0, _cam.z);

  const loader = new THREE.TextureLoader();
  const count = imageList.length;

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const x = Math.sin(angle) * CAROUSEL_RADIUS;
    const z = -Math.cos(angle) * CAROUSEL_RADIUS;

    const mat = new THREE.MeshBasicMaterial({ 
      side: THREE.DoubleSide, 
      transparent: true,
      opacity: 0.95
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    mesh.position.set(x, 1.2, z);
    mesh.lookAt(0, 1.2, 0);
    carouselGroup.add(mesh);

    loader.load(
      imageList[i],
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        mesh.material.map = tex;
        mesh.material.needsUpdate = true;

        const iw = tex.image?.naturalWidth || 512;
        const ih = tex.image?.naturalHeight || 512;
        const w = 1.2;
        const h = w * (ih / iw);

        mesh.geometry.dispose();
        mesh.geometry = new THREE.PlaneGeometry(w, h);
      },
      undefined,
      (err) => {
        console.warn(`Error carregant imatge carrusel: ${imageList[i]}`, err);
      }
    );

    carouselItems.push(mesh);
  }

  roomGroup.visible = false;
  carouselGroup.visible = true;
  state = 'carousel';
}

function closeCarousel() {
  clearGroup(carouselGroup);
  carouselGroup.visible = false;
  carouselItems = [];
  if (state === 'carousel') {
    roomGroup.visible = true;
    state = 'themeRoom';
  }
}

// ─── NAVEGACIÓ I SORTIDA ───────────────────────────────────────────────
function exitToMainHub() {
  closeCarousel();
  clearGroup(roomGroup);
  roomGroup.visible = false;
  mainHubGroup.visible = true;
  state = 'mainHub';
}

// ─── RAYCASTING I SELECCIÓ ─────────────────────────────────────────────
function getLookedMainPanel() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.72;
  for (let i = 0; i < mainPanels.length; i++) {
    if (!mainPanels[i].mesh.visible) continue;
    _to.copy(mainPanels[i].mesh.position).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

function getLookedRoomLabel() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.7;
  for (let i = 0; i < roomLabels.length; i++) {
    _to.copy(roomLabels[i].mesh.position).sub(_cam).normalize();
    const d = _fwd.dot(_to);
    if (d > bestDot) { bestDot = d; best = i; }
  }
  return best;
}

// ─── BOTÓ WEBXR AR ─────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
statusEl.textContent = 'Comprovant WebXR AR...';

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then(supported => {
    if (supported) {
      statusEl.textContent = 'Llest! Prem "START AR" per entrar a la sala.';
      document.body.appendChild(ARButton.createButton(renderer, { optionalFeatures: ['local-floor', 'bounded-floor'] }));
    } else {
      statusEl.textContent = 'AR no suportat en aquest navegador.';
    }
  });
}

// ─── INPUTS I JOYSTICK CONTINU ─────────────────────────────────────────
const infoEl = document.getElementById('controllerInfo');

function handleInput(delta, frame) {
  const session = renderer.xr.getSession(); if (!session) return;
  const refSpace = renderer.xr.getReferenceSpace(); let anyController = false;

  for (const src of session.inputSources) {
    if (!src.gamepad) continue;
    if (frame && refSpace) {
      const space = src.gripSpace || src.targetRaySpace;
      if (space) {
        const pose = frame.getPose(space, refSpace);
        if (pose) { anyController = true; }
      }
    }
    if (src.handedness !== 'right') continue;
    const gp = src.gamepad; 
    const aPressed = gp.buttons[4]?.pressed; 
    const bPressed = gp.buttons[5]?.pressed;

    // MOVIMENT DEL JOYSTICK DRET
    const axisX = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];
    if (axisX !== undefined) {
      const deadzone = 0.15;
      if (Math.abs(axisX) > deadzone) {
        const sign = Math.sign(axisX);
        const normalizedInput = (Math.abs(axisX) - deadzone) / (1.0 - deadzone);
        const maxTurnSpeed = 1.5; 

        if (state === 'carousel' && carouselGroup.visible) {
          // En mode carrusel, girem el conjunt d'imatges
          carouselGroup.rotation.y -= sign * normalizedInput * maxTurnSpeed * delta;
        } else {
          // En la resta d'estats, girem la càmera de l'usuari
          cameraGroup.rotation.y -= sign * normalizedInput * maxTurnSpeed * delta;
        }
      }
    }

    if (aPressed && !buttonStates.a) {
      if (state === 'mainHub') {
        const idx = getLookedMainPanel();
        if (idx !== -1 && hubItems[idx].id === 'dinacil') {
          buildThemeRoom();
        }
      } else if (state === 'themeRoom') {
        const ridx = getLookedRoomLabel();
        if (ridx !== -1) {
          openCarouselCategory(roomLabels[ridx].categoryKey);
        }
      }
    }

    if (bPressed && !buttonStates.b) {
      if (state === 'carousel') {
        closeCarousel();
      } else if (state === 'themeRoom') {
        exitToMainHub();
      }
    }

    buttonStates.a = aPressed; 
    buttonStates.b = bPressed;
  }
  if(infoEl) infoEl.textContent = anyController ? 'Mandos actius' : 'Mandos: buscant...';
}

// ─── BUCLE D'ANIMACIÓ ──────────────────────────────────────────────────
let lastClockTime = performance.now();

function animate(time, frame) {
  const now = performance.now();
  const delta = Math.min((now - lastClockTime) / 1000, 0.1); 
  lastClockTime = now;

  if (pendingHubRecenter && renderer.xr.getSession() && frame) { 
    recenterVR(); 
    pendingHubRecenter = false; 
  }

  camera.getWorldPosition(_camPos2D);

  if (state === 'mainHub') {
    const looked = getLookedMainPanel();
    for (let i = 0; i < mainPanels.length; i++) {
      const p = mainPanels[i];
      if (!p.mesh.visible) continue;
      const target = (i === looked) ? 1 : 0;
      p.prog += (target - p.prog) * 0.12;
      p.mesh.scale.setScalar(1 + 0.18 * p.prog);
      const camPos3 = new THREE.Vector3(); 
      camera.getWorldPosition(camPos3); 
      p.mesh.lookAt(camPos3.x, camPos3.y - 0.1, camPos3.z);
    }
  } else if (state === 'themeRoom') {
    const looked = getLookedRoomLabel();
    for (let i = 0; i < roomLabels.length; i++) {
      const r = roomLabels[i]; 
      const target = (i === looked) ? 1 : 0; 
      r.prog += (target - r.prog) * 0.12;
      r.mesh.scale.setScalar(1 + 0.25 * r.prog);
      r.mesh.material.opacity = 0.5 + 0.5 * r.prog;
      r.mesh.lookAt(_camPos2D.x, r.mesh.position.y, _camPos2D.z);
    }
  }

  handleInput(delta, frame);
  renderer.render(scene, camera);
}

renderer.setAnimationLoop((time, frame) => { animate(time, frame); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
