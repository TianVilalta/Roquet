<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>WebXR Meta Quest 3 - Gaze Navigation</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // Lògica de control de sales i botons dels comandaments
    AFRAME.registerComponent('room-manager', {
      init: function () {
        this.currentRoom = 'principal';
        this.closestElement = null;
        
        // Escoltadors globals per als botons de les Meta Quest (Mando dret i esquerre)
        window.addEventListener('abuttondown', this.onAButton.bind(this));
        window.addEventListener('bbuttondown', this.onBButton.bind(this));
        window.addEventListener('xbuttondown', this.onBButton.bind(this)); // Per si usen el mando esquerre
        window.addEventListener('ybuttondown', this.onBButton.bind(this));
        
        this.salaPrincipal = document.querySelector('#sala-principal');
        this.salaR3 = document.querySelector('#sala-r3');
        this.subSales = document.querySelector('#sub-sales');
        this.panellsText = document.querySelector('#panells-text');
      },

      tick: function() {
        // Cada fotograma busquem quin element té l'usuari més a prop del centre de la mirada
        this.updateClosestElement();
      },

      updateClosestElement: function() {
        // Busquem només els elements que formen part de la sala que està visible actualment
        let selector = '';
        if (this.currentRoom === 'principal') selector = '#sala-principal .target-look';
        else if (this.currentRoom === 'r3') selector = '#sala-r3 .target-look';
        else if (this.currentRoom.startsWith('sub-')) selector = '#sub-sales .target-look';

        const elements = document.querySelectorAll(selector);
        if (!elements.length) {
          this.closestElement = null;
          return;
        }

        const cameraEl = document.querySelector('#camera');
        const cameraMatrix = cameraEl.object3D.matrixWorld;
        
        // Vector cap a on mira la càmera (direcció cap endavant en tres dimensions)
        const cameraDirection = new THREE.Vector3(0, 0, -1).applyMatrix4(cameraMatrix).normalize();
        const cameraPosition = new THREE.Vector3().setFromMatrixPosition(cameraMatrix);

        let maxDot = -1;
        let bestEl = null;

        elements.forEach(el => {
          const elPosition = new THREE.Vector3().setFromMatrixPosition(el.object3D.matrixWorld);
          const toElement = elPosition.sub(cameraPosition).normalize();
          
          // El Producte Escalar (Dot Product) ens diu com de prop està l'objecte del centre de la visió (1.0 és perfecte)
          const dot = cameraDirection.dot(toElement);

          if (dot > maxDot) {
            maxDot = dot;
            bestEl = el;
          }
        });

        // Si l'element més proper ha canviat, actualitzem les mides (l'efecte de fer-se gran)
        if (bestEl !== this.closestElement) {
          if (this.closestElement) {
            this.closestElement.setAttribute('animation__scale', 'property: scale; to: 1 1 1; dur: 150; easing: easeOutQuad');
          }
          this.closestElement = bestEl;
          if (this.closestElement) {
            this.closestElement.setAttribute('animation__scale', 'property: scale; to: 1.25 1.25 1.25; dur: 150; easing: easeOutQuad');
          }
        }
      },

      onAButton: function () {
        if (!this.closestElement) return;

        const target = this.closestElement.getAttribute('data-target');
        const action = this.closestElement.getAttribute('data-action');

        if (target) {
          this.transitionToRoom(target);
        } else if (action) {
          this.openTextPanel(action);
        }
      },

      onBButton: function () {
        if (this.panellsText.getAttribute('visible')) {
          this.panellsText.setAttribute('visible', false);
          document.querySelectorAll('.contingut-panell').forEach(p => p.setAttribute('visible', false));
          return;
        }

        if (this.currentRoom.startsWith('sub-')) {
          this.transitionToRoom('r3');
        } else if (this.currentRoom !== 'principal') {
          this.transitionToRoom('principal');
        }
      },

      transitionToRoom: function(roomName) {
        // Reset de l'escala de l'element que deixem enrere
        if (this.closestElement) {
          this.closestElement.setAttribute('scale', '1 1 1');
        }

        this.currentRoom = roomName;
        
        this.salaPrincipal.setAttribute('visible', false);
        this.salaR3.setAttribute('visible', false);
        this.subSales.setAttribute('visible', false);
        this.panellsText.setAttribute('visible', false);
        document.querySelectorAll('.sub-sala-contingut').forEach(s => s.setAttribute('visible', false));

        if (roomName === 'principal') {
          this.salaPrincipal.setAttribute('visible', true);
        } else if (roomName === 'r3') {
          this.salaR3.setAttribute('visible', true);
        } else if (roomName.startsWith('sub-')) {
          this.subSales.setAttribute('visible', true);
          const subSalaEspecifica = document.querySelector(`#sala-${roomName.replace('sub-', '')}`);
          if (subSalaEspecifica) subSalaEspecifica.setAttribute('visible', true);
        }
        
        this.closestElement = null;
      },

      openTextPanel: function(actionType) {
        this.panellsText.setAttribute('visible', true);
        document.querySelectorAll('.contingut-panell').forEach(p => p.setAttribute('visible', false));
        
        const panell = document.querySelector(`#panell-${actionType}`);
        if (panell) panell.setAttribute('visible', true);
      }
    });
  </script>
</head>
<body>

  <a-scene room-manager>
    
    <a-assets>
      <!-- Fons 3D -->
      <a-asset-item id="fons-room" src="room.glb"></a-asset-item>

      <!-- Imatges Estructura -->
      <img id="img-r1" src="r1.png">
      <img id="img-r2" src="r2.png">
      <img id="img-r3" src="r3.png">
      <img id="img-r4" src="r4.png">
      <img id="img-r5" src="r5.png">

      <!-- Imatges R3 -->
      <img id="img-hydraulics" src="hydraulics.png">
      <img id="img-pedro" src="pedro.png">
      <img id="img-fundiciones" src="fundiciones.png">
      <img id="img-dinacil" src="dinacil.png">
      <img id="img-eastern" src="eastern.png">
      <img id="img-tekor" src="tekor.png">
    </a-assets>

    <!-- FONS 3D ESTÀTIC -->
    <a-entity gltf-model="#fons-room" position="0 0 0" rotation="0 0 0"></a-entity>
    
    <a-entity light="type: ambient; intensity: 0.9;"></a-entity>
    <a-entity light="type: directional; intensity: 0.4" position="2 4 1"></a-entity>

    <!-- CÀMERA DE L'USUARI (Sense punters visibles a la pantalla, net de línies) -->
    <a-entity id="rig" position="0 0 0">
      <a-entity id="camera" camera look-controls position="0 1.6 0"></a-entity>
      
      <!-- Connectem els mandos de forma silent per capturar els botons de Meta, sense línies làser reflectides -->
      <a-entity oculus-touch-controls="hand: right"></a-entity>
      <a-entity oculus-touch-controls="hand: left"></a-entity>
    </a-entity>


    <!-- =======================================================
         1. SALA PRINCIPAL
         - Més alta: Alçada Y = 2.2 metres
         - Més gran: Radi de distància = 5.0 metres
         ======================================================= -->
    <a-entity id="sala-principal" visible="true">
      <a-image class="target-look" src="#img-r1" data-target="r1" position="0 2.2 -5.0" rotation="0 0 0" width="1.8" height="1.2"></a-image>
      <a-image class="target-look" src="#img-r2" data-target="r2" position="4.75 2.2 -1.55" rotation="0 -72 0" width="1.8" height="1.2"></a-image>
      <a-image class="target-look" src="#img-r3" data-target="r3" position="2.94 2.2 4.05" rotation="0 -144 0" width="1.8" height="1.2"></a-image>
      <a-image class="target-look" src="#img-r4" data-target="r4" position="-2.94 2.2 4.05" rotation="0 144 0" width="1.8" height="1.2"></a-image>
      <a-image class="target-look" src="#img-r5" data-target="r5" position="-4.75 2.2 -1.55" rotation="0 72 0" width="1.8" height="1.2"></a-image>
    </a-entity>


    <!-- =======================================================
         2. SALA R3
         - Més alta: Alçada Y = 2.2 metres
         - Més gran: Radi de distància = 5.0 metres
         ======================================================= -->
    <a-entity id="sala-r3" visible="false">
      <a-image class="target-look" src="#img-hydraulics" data-target="sub-hydraulics" position="0 2.2 -5.0" rotation="0 0 0" width="1.6" height="1.0"></a-image>
      <a-image class="target-look" src="#img-pedro" data-target="sub-pedro" position="4.33 2.2 -2.5" rotation="0 -60 0" width="1.6" height="1.0"></a-image>
      <a-image class="target-look" src="#img-fundiciones" data-target="sub-fundiciones" position="4.33 2.2 2.5" rotation="0 -120 0" width="1.6" height="1.0"></a-image>
      <a-image class="target-look" src="#img-dinacil" data-target="sub-dinacil" position="0 2.2 5.0" rotation="0 -180 0" width="1.6" height="1.0"></a-image>
      <a-image class="target-look" src="#img-eastern" data-target="sub-eastern" position="-4.33 2.2 2.5" rotation="0 120 0" width="1.6" height="1.0"></a-image>
      <a-image class="target-look" src="#img-tekor" data-target="sub-tekor" position="-4.33 2.2 -2.5" rotation="0 60 0" width="1.6" height="1.0"></a-image>
    </a-entity>


    <!-- =======================================================
         3. SUB-SALES (Botons text davant l'usuari)
         ======================================================= -->
    <a-entity id="sub-sales" visible="false">
      
      <!-- Botó: Que Fem? (Disseny: Fons negre, contorn gris, text blanc) -->
      <a-entity class="target-look" id="btn-quefem" position="-0.8 2.2 -3.0"
                geometry="primitive: plane; width: 1.3; height: 0.5" 
                material="color: #000000; shader: flat;"
                data-action="quefem">
        <!-- Contorn exterior gris per simular el contorn i vores -->
        <a-entity geometry="primitive: plane; width: 1.34; height: 0.54" material="color: #888888; shader: flat;" position="0 0 -0.01"></a-entity>
        <a-text value="Que Fem?" align="center" color="#FFFFFF" width="4.5" position="0 0 0.02"></a-text>
      </a-entity>

      <!-- Botó: Com ho fem? -->
      <a-entity class="target-look" id="btn-comhofem" position="0.8 2.2 -3.0"
                geometry="primitive: plane; width: 1.3; height: 0.5" 
                material="color: #000000; shader: flat;"
                data-action="comhofem">
        <!-- Contorn exterior gris -->
        <a-entity geometry="primitive: plane; width: 1.34; height: 0.54" material="color: #888888; shader: flat;" position="0 0 -0.01"></a-entity>
        <a-text value="Com ho fem?" align="center" color="#FFFFFF" width="4.5" position="0 0 0.02"></a-text>
      </a-entity>

      <a-entity id="sala-hydraulics" class="sub-sala-contingut" visible="false"></a-entity>
      <a-entity id="sala-pedro" class="sub-sala-contingut" visible="false"></a-entity>
      <a-entity id="sala-fundiciones" class="sub-sala-contingut" visible="false"></a-entity>
      <a-entity id="sala-dinacil" class="sub-sala-contingut" visible="false"></a-entity>
      <a-entity id="sala-eastern" class="sub-sala-contingut" visible="false"></a-entity>
      <a-entity id="sala-tekor" class="sub-sala-contingut" visible="false"></a-entity>
    </a-entity>


    <!-- =======================================================
         4. FINESTRES DE TEXT INTERNES
         ======================================================= -->
    <a-entity id="panells-text" position="0 2.0 -2.5" visible="false">
      <!-- Finestra de dades text blanc, fons negre, contorn gris -->
      <a-entity geometry="primitive: plane; width: 2.4; height: 1.4" material="color: #000000; shader: flat;"></a-entity>
      <a-entity geometry="primitive: plane; width: 2.44; height: 1.44" material="color: #888888; shader: flat;" position="0 0 -0.01"></a-entity>
      
      <a-text value="Premeu el boto B / Y per tancar" align="center" color="#888888" width="3.5" position="0 -0.55 0.02"></a-text>

      <!-- Continguts per omplir -->
      <a-text id="panell-quefem" class="contingut-panell" visible="false" value="[Finestra Buida]\n\nSeccio: Que Fem?\n\nText de prova per a la configuracio." align="center" color="#FFFFFF" width="5.5" position="0 0.1 0.02"></a-text>
      <a-text id="panell-comhofem" class="contingut-panell" visible="false" value="[Finestra Buida]\n\nSeccio: Com ho fem?\n\nText de prova per a la configuracio." align="center" color="#FFFFFF" width="5.5" position="0 0.1 0.02"></a-text>
    </a-entity>

  </a-scene>

</body>
</html>
