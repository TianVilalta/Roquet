<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #3b3b3b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ── TEXT INFORMATIU SUPERIOR (A DAVANT DE TOT) ── */
  .top-text {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    
    /* CONTROL DE VISIBILITAT CRÍTIC */
    z-index: 9999 !important; /* Força que es posicioni absolutament a davant de les imatges */
    color: #ff3b30;           /* Color cridaner temporal perquè el trobis fàcilment */
    font-size: 16px;          /* Una mica més gran perquè es llegeixi millor */
    font-weight: bold;
    
    background: #1a1a1a;      /* Fons fosc sòlid per contrastar */
    border-bottom: 2px solid #ff3b30;
  }

  /* ── IMATGE PRINCIPAL ── */
  #main-preview {
    position: fixed;
    top: 50px; /* Comença just a sota del text superior */
    left: 0; right: 0;
    bottom: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1; /* Forçat a estar darrere del text */
  }
  #main-preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  #main-preview img.fade {
    opacity: 0;
    transform: scale(1.02);
  }

  /* ── BARRA DE MINIATURES ── */
  .thumb-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 110px;
    background: rgba(20,20,20,0.55);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    z-index: 10;
  }

  /* miniatures */
  .thumb-btn {
    width: 82px;
    height: 82px;
    padding: 0;
    border: 2px solid transparent;
    background: #2a2a2a;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    transition: border-color 0.25s;
  }
  .thumb-btn img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.55);
    transition: filter 0.3s, transform 0.3s;
  }
  .thumb-btn:hover img { filter: brightness(0.82); transform: scale(1.06); }
  .thumb-btn.active { border-color: rgba(255,255,255,0.75); }
  .thumb-btn.active img { filter: brightness(1); }
</style>
</head>
<body>

<!-- TEXT SUPERIOR -->
<div class="top-text">
  TEXT DE PROVA: Si llegeixes això, ara funciona correctament.
</div>

<!-- IMATGE GRAN -->
<div id="main-preview">
  <img id="main-img" src="images/imatge1.png" alt="Imatge principal">
</div>

<!-- BARRA INFERIOR -->
<div class="thumb-bar">
  <button class="thumb-btn active" data-index="0">
    <img src="images/imatge1.png" alt="1">
  </button>
  <button class="thumb-btn" data-index="1">
    <img src="images/imatge2.png" alt="2">
  </button>
  <button class="thumb-btn" data-index="2">
    <img src="images/imatge3.png" alt="3">
  </button>
  <button class="thumb-btn" data-index="3">
    <img src="images/imatge4.png" alt="4">
  </button>
</div>


<script>
  const images = [
    { thumb: 'images/imatge1.png', full: 'images/imatge1.png' },
    { thumb: 'images/imatge2.png', full: 'images/imatge2.png' },
    { thumb: 'images/imatge3.png', full: 'images/imatge3.png' },
    { thumb: 'images/imatge4.png', full: 'images/imatge4.png' },
  ];

  let current = 0;
  let autoTimer = null;
  const AUTO_INTERVAL = 5000;

  const mainImg   = document.getElementById('main-img');
  const thumbBtns = document.querySelectorAll('.thumb-btn');

  function select(index, resetTimer = true) {
    const next = (index + images.length) % images.length;
    if (next === current) return;
    current = next;

    thumbBtns.forEach(b => b.classList.remove('active'));
    thumbBtns[current].classList.add('active');

    mainImg.classList.add('fade');
    setTimeout(() => {
      mainImg.src = images[current].full;
      mainImg.classList.remove('fade');
    }, 320);

    if (resetTimer) restartAutoRotate();
  }

  function startAutoRotate() {
    autoTimer = setInterval(() => select(current + 1, false), AUTO_INTERVAL);
  }

  function restartAutoRotate() {
    clearInterval(autoTimer);
    startAutoRotate();
  }

  thumbBtns.forEach(btn =>
    btn.addEventListener('click', () => select(+btn.dataset.index))
  );

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  select(current - 1);
    if (e.key === 'ArrowRight') select(current + 1);
  });

  startAutoRotate();
</script>
</body>
</html>
